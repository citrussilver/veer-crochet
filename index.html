<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <title>Veer Crochet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Permanent+Marker&family=Source+Sans+Pro&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/06f545a89b.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/effects.css">
    <link rel="stylesheet" href="css/carousel.css">
</head>
<body>
    <div class="container">
        <div id="main-img" aria-hidden="false">
            <img
                id="gallery-active-img"
                class="gallery__active-img"
                src="/img/suisei-50p.jpg"
                alt="Hoshimachi Suisei crochet doll"
                draggable="false"
            >
        </div>
        <div id="gallery-ui" class="gallery-ui" hidden>
            <button type="button" id="gallery-prev" class="gallery-nav gallery-nav--prev">Prev</button>
            <button type="button" id="gallery-next" class="gallery-nav gallery-nav--next">Next</button>
        </div>
        <aside id="gallery-basket" class="gallery-basket" hidden aria-label="Photo prize catcher">
            <div class="gallery-basket__strips"></div>
            <img src="/img/ufo-catcher.png" alt="" class="gallery-basket__img" aria-hidden="true">
        </aside>
        <button type="button" id="click-me-bubble" class="click-me-bubble gallery-dismiss" hidden>
            <span class="click-me-bubble__tail" aria-hidden="true"></span>
            Click Me !
        </button>
        <div class="wave wave-1" aria-hidden="true">
            <svg class="wave-shape wave-shape--desktop" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path fill="#ffacad" d="M0,0L120,5.3C240,11,480,21,720,21.3C960,21,1200,11,1320,5.3L1440,0L1440,320L1320,320C1200,320,960,320,720,320C480,320,240,320,120,320L0,320Z"/>
            </svg>
            <svg class="wave-shape wave-shape--mobile" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path fill="#ffacad" d="M0,0L120,5.3C240,11,480,21,720,21.3C960,21,1200,11,1320,5.3L1440,0L1440,320L1320,320C1200,320,960,320,720,320C480,320,240,320,120,320L0,320Z"/>
            </svg>
        </div>
        <div class="wave wave-2" aria-hidden="true">
            <svg class="wave-shape wave-shape--desktop" viewBox="0 0 1440 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path fill="#ffdea2" d="M 0,700 C 0,700 0,350 0,350 C 133,300.07142857142856 266,250.14285714285717 375,262 C 484,273.85714285714283 568.9999999999999,347.5 683,361 C 797.0000000000001,374.5 940,327.85714285714283 1071,316 C 1202,304.14285714285717 1321,327.07142857142856 1440,350 C 1440,350 1440,700 1440,700 Z"/>
            </svg>
            <svg class="wave-shape wave-shape--mobile" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path fill="#ffdea2" d="M0,32L48,32C96,32,192,32,288,58.7C384,85,480,139,576,149.3C672,160,768,128,864,122.7C960,117,1056,139,1152,160C1248,181,1344,203,1392,213.3L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"/>
            </svg>
        </div>
        <div id="veer-div">
            <section id="veer-text" class="text-styling">Veer Crochet</section>
        </div>
        <div id="catchphrase-div">
            <section id="catchphrase-text">LOVINGLY HANDMADE JUST FOR YOU</section>
        </div>
        <div class="icons-div">
            <div id="fb-icon" class="text-styling"><a href="https://www.facebook.com/VeerCrochet" title="Official FB Page" alt="FB Page" target="_blank"><i class="fab fa-facebook fa-3x"></i></a></div>
            <div id="ig-icon" class="text-styling"><a href="https://instagram.com/veercrochet" title="Official IG Page" alt="IG Page" target="_blank"><i class="fab fa-instagram fa-3x"></i></a></div>
        </div>
        <footer class="site-footer">
            <small>2021 DrunkIceCube</small>
        </footer>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
